name: build profile assets

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/fonts/**"
      - "assets/icons/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "fonttools>=4.34" brotli
      - run: python -m unittest discover -s scripts -p "test_*.py" -v
      - run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || { git commit -m "chore: rebuild profile assets"; git push; }
